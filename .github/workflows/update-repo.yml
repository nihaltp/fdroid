name: Update F-Droid Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: fdroid-repository-update
  cancel-in-progress: false

jobs:
  update-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install F-Droid tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver PyYAML
          fdroid --version

      - name: Import latest releases
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASES_READ_TOKEN: ${{ secrets.RELEASES_READ_TOKEN }}
        run: python scripts/update_repo.py

      - name: Sync Fastlane store metadata
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASES_READ_TOKEN: ${{ secrets.RELEASES_READ_TOKEN }}
        run: python scripts/sync_fastlane_metadata.py

      - name: Organize APKs by version name
        run: python scripts/organize_releases.py

      - name: Restore F-Droid repository signing key
        env:
          FDROID_INDEX_KEYSTORE: ${{ secrets.FDROID_INDEX_KEYSTORE }}
        run: |
          set +x
          umask 077
          printf '%s' "$FDROID_INDEX_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/fdroid-index.p12"
          test -s "$RUNNER_TEMP/fdroid-index.p12"

      - name: Configure F-Droid and update indexes
        env:
          FDROID_INDEX_KEYSTORE_PASSWORD: ${{ secrets.FDROID_INDEX_KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config_data = yaml.safe_load(Path("apps.yml").read_text(encoding="utf-8"))
          keep = int(config_data.get("history", {}).get("keep_in_main_repo", 3))
          if keep != 3:
              print(f"Configured main repository retention: {keep} versions per app")
          if keep < 1:
              raise SystemExit("history.keep_in_main_repo must be >= 1")

          # scripts/organize_releases.py has already enforced retention by
          # versionName groups. Set F-Droid's per-app APK-count threshold above
          # the largest retained APK set so fdroid update does not split a group.
          repo_apk_counts = [
              sum(1 for _ in Path("repo").glob(f"{app['package']}_*.apk"))
              for app in config_data["apps"]
          ]
          fdroid_archive_threshold = max(repo_apk_counts, default=0) + 1

          config = {
              "repo_url": "https://nihaltp.github.io/fdroid/repo",
              "repo_name": "nihaltp's F-Droid Repository",
              "repo_description": "Open-source Android apps developed by nihaltp.",
              "repo_keyalias": "fdroid-index",
              "keystore": os.path.join(os.environ["RUNNER_TEMP"], "fdroid-index.p12"),
              "keystorepass": os.environ["FDROID_INDEX_KEYSTORE_PASSWORD"],
              "keypass": os.environ["FDROID_INDEX_KEYSTORE_PASSWORD"],
              "archive_older": fdroid_archive_threshold,
              "archive_url": "https://nihaltp.github.io/fdroid/archive",
              "archive_name": "nihaltp's F-Droid Archive",
              "archive_description": "Older versions of applications developed by nihaltp.",
          }
          Path("config.yml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          print(f"Custom retention: {keep} distinct versionName group(s) per app")
          print(f"F-Droid APK-count safety threshold: {fdroid_archive_threshold}")
          PY
          fdroid update --pretty

      - name: Commit updated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive metadata repo release-state.json
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Update F-Droid repository"
          git push
